let pageHistory = ['teachers-page'];

function showPage(pageId) {
    document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
    const target = document.getElementById(pageId);
    if (target) {
        target.classList.add('active');
        if (pageHistory[pageHistory.length - 1] !== pageId) {
            pageHistory.push(pageId);
        }
        window.scrollTo(0, 0);
    }
}

function goBack() {
    if (pageHistory.length > 1) {
        pageHistory.pop();
        const prevPage = pageHistory[pageHistory.length - 1];
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(prevPage);
        if (target) {
            target.classList.add('active');
        }
    } else {
        showPage('teachers-page');
    }
}

function toggleMenu() {
    const overlay = document.getElementById('navOverlay');
    if (overlay) {
        overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
    }
}

function closeMenu(event) {
    if (event.target.id === 'navOverlay') {
        document.getElementById('navOverlay').style.display = 'none';
    }
}

function openSearchModal() {
    document.getElementById('searchModal').style.display = 'flex';
    document.getElementById('searchInput').focus();
}

function closeSearchModal() {
    document.getElementById('searchModal').style.display = 'none';
}

window.addEventListener('click', function(event) {

function handleSearchInput(e) {
    const query = e.target.value.trim().toLowerCase();
    const container = document.getElementById('searchResultsContainer');
    if (!query) {
        container.innerHTML = '<div class="search-no-results">اكتب اسم المدرس للبحث...</div>';
        return;
    }
    const results = searchIndex.filter(item => item.title.toLowerCase().includes(query));
    if (results.length === 0) {
        container.innerHTML = '<div class="search-no-results">لا توجد نتائج مطابقة لبحثك</div>';
        return;
    }
    container.innerHTML = results.map(r => `
        <div class="search-result-item" onclick="showPage('${r.page}'); closeSearchModal();">
            <div class="search-result-content-wrap">
                <img src="${r.image}" class="search-result-thumb" alt="${r.title}">
                <div class="search-result-info">
                    <span class="search-result-title">${r.title}</span>
                    <span class="search-result-category">${r.category}</span>
                </div>
            </div>
            <span>➔</span>
        </div>
    `).join('');
}

function sortTeacherContainer(containerSelector) {
    const container = document.querySelector(containerSelector);
    if (!container) return;
    const cards = Array.from(container.querySelectorAll('.book-card-item'));
    cards.sort((a, b) => {
        const countA = parseInt(a.querySelector('[id^="votes-count-"]').innerText || '0');
        const countB = parseInt(b.querySelector('[id^="votes-count-"]').innerText || '0');
        return countB - countA;
    });
    cards.forEach(card => container.appendChild(card));
}

const categories = ['arabic', 'islamic', 'math', 'english', 'biology', 'chemistry', 'physics'];

function voteTeacher(category, teacherId) {
    let userVote = localStorage.getItem('user_vote_' + category);
    let voteRef = db.ref('votes/' + category + '/' + teacherId);

    voteRef.transaction(currentVotes => {
        currentVotes = currentVotes || 0;
        if (userVote === teacherId) {
            localStorage.removeItem('user_vote_' + category);
            return Math.max(0, currentVotes - 1);
        } else {
            if (userVote) {
                let prevVoteRef = db.ref('votes/' + category + '/' + userVote);
                prevVoteRef.transaction(prevCount => Math.max(0, (prevCount || 1) - 1));
            }
            localStorage.setItem('user_vote_' + category, teacherId);
            return currentVotes + 1;
        }
    }, (error) => {
        if (error) {
            console.error('فشل عملية التصويت:', error);
        }
    });
}

function initRealtimeVotes() {
    categories.forEach(cat => {
        let categoryRef = db.ref('votes/' + cat);
        categoryRef.on('value', snapshot => {
            let data = snapshot.val() || {};
            let userVote = localStorage.getItem('user_vote_' + cat);

            let container = document.querySelector('#teacher-' + cat + ' .books-list-container');
            if (!container) return;

            let cards = Array.from(container.querySelectorAll('.book-card-item'));
            cards.forEach(card => {
                let tId = card.getAttribute('data-teacher-id');
                let votes = data[tId] || 0;
                
                let countEl = document.getElementById('votes-count-' + tId);
                let btnEl = document.getElementById('vote-btn-' + tId);
                let textEl = document.getElementById('vote-text-' + tId);

                if (countEl) countEl.innerText = votes;
                if (btnEl && textEl) {
                    if (userVote === tId) {
                        btnEl.style.background = '#059669';
                        textEl.innerText = 'تم التصويت ✓ (إلغاء)';
                    } else {
                        btnEl.style.background = '#10b981';
                        textEl.innerText = 'تصويت';
                    }
                }
            });

            sortTeacherContainer('#teacher-' + cat + ' .books-list-container');
        });
    });
}

window.addEventListener('DOMContentLoaded', () => {
